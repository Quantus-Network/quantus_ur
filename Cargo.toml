[package]
name = "quantus_ur"
version = "1.6.0"
edition = "2021"
description = "Encode and decode Quantus sign requests as UR QR codes"
license = "MIT"
repository = "https://github.com/Quantus-Network/quantus_ur"
readme = "README.md"
categories = ["encoding"]
keywords = ["cbor", "qr", "quantus", "ur"]

[dependencies]
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
ur-parse-lib = { version = "1.0.6", default-features = false }
ur = { package = "keystone-ur", version = "0.1.1", default-features = false }
minicbor = { version = "0.19", default-features = false, features = ["alloc"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "decode"
harness = false

[features]
default = ["std"]
std = ["ur-parse-lib/std"]
core = ["ur-parse-lib/core"]
# Exposes `test_helpers` to the out-of-workspace `fuzz/` targets.
fuzzing = []